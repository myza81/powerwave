# Powerwave Source Fingerprint Registry
# =======================================
# Named fingerprints for recurring data sources.
# Fingerprints scope mapping rules to specific source patterns.
#
# Note: column_signature is a 16-hex deterministic SHA-256 prefix
# generated by build_fingerprint_from_columns() — do not edit manually.
# Omit any field you do not want to constrain (partial fingerprints allowed).
#
# Fields:
#   name:             Human-readable identifier (for documentation only)
#   vendor:           Optional vendor string
#   station:          Optional station name (e.g. "PULU")
#   export_type:      "comtrade" | "csv" | "excel"
#   source_kind:      "scada_trend" | "fault_recorder" | "pmu" | etc.
#   column_signature: 16-hex hash of sorted, normalised column names
#
# Example:
#   fingerprints:
#     - name: pulu_scada_trend
#       station: PULU
#       export_type: csv
#       source_kind: scada_trend
#       column_signature: a3f1c8e2d9b04561
#
fingerprints: []
